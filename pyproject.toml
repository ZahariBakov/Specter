[project]
name = "specter"
version = "0.1.0"
description = "Small cross-platform hardware monitor with a transparent always-on-top panel"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=11.495"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
specter = "specter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
